# Render Blueprint for the API and the PostgreSQL database that stores scan photos.
databases:
  - name: cropscan-db
    plan: free
    databaseName: cropscan
    user: cropscan

services:
  - type: web
    name: cropscan-api
    runtime: docker
    plan: free
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cropscan-db
          property: connectionString
      - key: SCAN_MEDIA_BACKEND
        value: database
      - key: SCAN_MEDIA_SIGNING_KEY
        generateValue: true
      - key: INFERENCE_THREADS
        value: "1"
      - key: SCAN_CONCURRENCY
        value: "1"
      - key: AWS_EC2_METADATA_DISABLED
        value: "true"
      - key: CORS_ORIGINS
        value: "https://vr-plant-helath.vercel.app"
